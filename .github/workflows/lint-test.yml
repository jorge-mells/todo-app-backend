name: Lint And Test
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
env:
  DB_USER: test # ${{ vars.DB_USER }} use this if stuff start to change a lot and add it to repository variables(not environment)
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  DB_HOST: db
  DB_PORT: 3306
  DB_NAME: test
  REDIS_HOST: redis
  REDIS_PORT: 6379

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint --if-present
  test:
    runs-on: ubuntu-latest
    environment: test-and-lint
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker Containers
      run: docker compose build
    - name: Run tests
      run: docker compose run --rm test
    - name: Cleanup
      if: always()
      run: docker compose down -v
